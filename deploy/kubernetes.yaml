# Local-cluster example. No ingress, public load balancer, or cloud resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: inference-lab}
  template:
    metadata:
      labels: {app: inference-lab}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: inference-lab:local
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inference-lab
spec:
  type: ClusterIP
  selector: {app: inference-lab}
  ports: [{port: 8000, targetPort: 8000}]
