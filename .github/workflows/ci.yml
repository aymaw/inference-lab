name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m inferlab.train --out runs/model
      - run: uv run python -m build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inference-lab:ci .
      - run: >-
          docker run -d --name inference-lab-ci --read-only --cap-drop ALL
          --security-opt no-new-privileges -p 127.0.0.1:8000:8000 inference-lab:ci
      - run: test "$(docker exec inference-lab-ci id -u)" = "10001"
      - run: python3 tests/container_smoke.py
      - if: always()
        run: docker logs inference-lab-ci; docker stop inference-lab-ci
